name: Temporary Rust formatting repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format workspace and commit formatting
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: format Rust workspace"
            git push origin HEAD:main
          fi

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

      - name: Build documentation
        run: cargo doc --workspace --no-deps

      - name: Run Phase 1 CLI demonstration
        run: cargo run --quiet -p gravity-cli -- demo

      - name: Run Phase 2 live evolution demonstration
        run: cargo run --quiet -p gravity-cli -- evolve-demo
